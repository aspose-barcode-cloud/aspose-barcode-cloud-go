name: Go

on:
  push:
    branches: [ v4 ]
  pull_request:
    branches: [ v4 ]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # See go.mod for oldest supported version
        # And https://go.dev/dl/ for updates
        # https://github.com/actions/setup-go/#using-stableoldstable-aliases
        go-version: [ '1.24', 'oldstable', 'stable' ]
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go.sum

      - name: Get dependencies
        run: make init

      - name: Build and Test
        run: |
         chmod +x scripts/*
         make ci
        env:
          TEST_JWT_ACCESS_TOKEN: ${{ secrets.TEST_CONFIGURATION_ACCESS_TOKEN }}

  coverage:
    name: Library coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go.sum

      - name: Get dependencies
        run: make init

      - name: Check library coverage
        run: |
         chmod +x scripts/*
         make cover
        env:
          TEST_JWT_ACCESS_TOKEN: ${{ secrets.TEST_CONFIGURATION_ACCESS_TOKEN }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage/coverage-badge.json
            coverage/coverage-summary.json
            coverage/coverage.out

  publish-coverage:
    name: Publish coverage
    needs: coverage
    # Only pushes to the default branch publish, and only once the GitHub App for
    # the test-coverage repository is configured (COVERAGE_APP_ID variable).
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.COVERAGE_APP_ID != ''
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage
      - name: Get a token for the test-coverage repository
        id: coverage-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.COVERAGE_APP_ID }}
          private-key: ${{ secrets.COVERAGE_APP_PRIVATE_KEY }}
          owner: aspose-barcode-cloud
          repositories: test-coverage
          permission-contents: write
      - name: Publish to test-coverage
        run: ./scripts/publish-coverage.bash go
        env:
          COVERAGE_TOKEN: ${{ steps.coverage-token.outputs.token }}
          COVERAGE_APP_SLUG: ${{ steps.coverage-token.outputs.app-slug }}
